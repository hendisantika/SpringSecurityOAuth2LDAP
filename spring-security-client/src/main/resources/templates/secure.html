<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Spring Security OAuth2 LDAP Example</title>
</head>
<body>

<h1>Spring Security OAuth2 LDAP Example - Secured</h1>

<p>Welcome, <strong sec:authentication="name">user</strong>!</p>

<p>Authorities: <span sec:authentication="principal.authorities">[]</span></p>

<form method="post" th:action="@{/logout}">
    <button type="submit">Logout</button>
</form>

</body>
</html>
