# This workflow builds & tests every Maven module with JDK 25 and caches dependencies.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - spring-security-oauth2-server-ldap
          - spring-security-client
    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Build & test with Maven Wrapper
        run: ./mvnw -B -ntp verify

  dependency-graph:
    name: Submit dependency graph
    # Only on push to master: PRs (incl. Dependabot) get a read-only token
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        module:
          - spring-security-oauth2-server-ldap
          - spring-security-client
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v6
        with:
          directory: ${{ github.workspace }}/${{ matrix.module }}
          correlator: ${{ github.job }}-${{ matrix.module }}
