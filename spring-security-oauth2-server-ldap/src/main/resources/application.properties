server.port=8081
server.servlet.context-path=/auth
server.servlet.session.cookie.name=AUTHSESSION

# Embedded LDAP server (UnboundID) seeded from users.ldif
spring.ldap.embedded.base-dn=dc=hendisantika,dc=com
spring.ldap.embedded.ldif=classpath:users.ldif
spring.ldap.embedded.port=8389
spring.ldap.base=dc=hendisantika,dc=com

# OAuth2 Authorization Server
spring.security.oauth2.authorizationserver.issuer=http://localhost:8081/auth
spring.security.oauth2.authorizationserver.client.ui-client.registration.client-id=ClientId
spring.security.oauth2.authorizationserver.client.ui-client.registration.client-secret={noop}secret
spring.security.oauth2.authorizationserver.client.ui-client.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.ui-client.registration.authorization-grant-types=authorization_code,refresh_token
spring.security.oauth2.authorizationserver.client.ui-client.registration.redirect-uris=http://localhost:8080/ui/login/oauth2/code/ldap-auth
spring.security.oauth2.authorizationserver.client.ui-client.registration.post-logout-redirect-uris=http://localhost:8080/ui/
spring.security.oauth2.authorizationserver.client.ui-client.registration.scopes=openid,profile,user_info
spring.security.oauth2.authorizationserver.client.ui-client.require-authorization-consent=false
